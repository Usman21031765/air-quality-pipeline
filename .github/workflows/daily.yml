name: Daily air-quality pipeline

on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC
  workflow_dispatch:          # lets you run it manually
    inputs:
      past_days:
        description: "Days of history to fetch (use 90 for a one-off backfill)"
        default: "2"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run pipeline
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python run_pipeline.py --past-days ${{ github.event.inputs.past_days || '2' }}
      - name: Commit updated local database (only changes when running without Azure)
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add data/air_quality.db
          git diff --cached --quiet || git commit -m "Daily data update"
          git push
